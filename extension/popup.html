<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#1c1917; --muted:#57534e; --line:#d6d3d1; --go:#15803d; --go-fg:#fff; --soft:#f5f5f4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; --go:#16a34a; --go-fg:#fff; --soft:#292524; }
  }
  body { font:13px/1.45 system-ui,sans-serif; width:264px; margin:0; padding:12px; background:var(--bg); color:var(--fg); }
  h1 { font-size:14px; margin:0 0 10px; }
  label.field { display:block; margin-bottom:8px; color:var(--muted); }
  select { width:100%; margin-top:3px; padding:5px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:5px; }
  .check { display:flex; gap:6px; align-items:center; margin:6px 0; color:var(--muted); }
  button { width:100%; margin-top:6px; padding:7px; font:inherit; border-radius:6px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--fg); }
  button.go { background:var(--go); color:var(--go-fg); border-color:var(--go); font-weight:600; }
  .row { display:flex; gap:6px; } .row button { flex:1; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--go); outline-offset:2px; }
  #status { margin-top:10px; padding:7px; background:var(--soft); border-radius:6px; color:var(--muted); white-space:pre-line; word-break:break-word; min-height:1.3em; }
  a { color:var(--go); font-size:12px; display:inline-block; margin-top:8px; }
  .hint { margin-top:6px; color:var(--muted); font-size:11px; }
</style>
</head>
<body>
  <h1>Quiz Helper</h1>
  <label class="field">Course
    <select id="course"></select>
  </label>
  <button id="solve" class="go">Solve current question</button>
  <button id="solveAll">Solve whole page</button>
  <label class="check"><input type="checkbox" id="showPanel"> Show answer panel on the page</label>
  <label class="check"><input type="checkbox" id="useImage"> Send a screenshot of each question</label>
  <label class="check"><input type="checkbox" id="savePng"> Save screenshots + answers to Downloads</label>
  <label class="check"><input type="checkbox" id="highlight"> Also highlight the option on the page</label>
  <label class="check"><input type="checkbox" id="autoClick"> Auto-select the answer (you press Submit)</label>
  <div class="row">
    <button id="reset">New session</button>
    <button id="clear">Clear panel</button>
  </div>
  <div id="status"></div>
  <a href="#" id="opts">Manage courses &amp; API key →</a>
  <div class="hint">Alt+Q solves the current question. With the panel off, the answer still shows here and is saved to Downloads. Keep this tab in front while it runs.</div>
  <script src="popup.js"></script>
</body>
</html>
